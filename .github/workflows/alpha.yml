name: Manual Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Test
        run: cargo test --workspace

      - name: Restore WiX tools
        run: dotnet tool restore

      - name: Package x64 release
        shell: pwsh
        run: ./scripts/package.ps1 -Architecture x64 -Configuration release -ReleaseTag "manual-${{ github.run_number }}"

      - name: Package ARM64 release
        shell: pwsh
        run: ./scripts/package.ps1 -Architecture arm64 -Configuration release -ReleaseTag "manual-${{ github.run_number }}"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: LSENext-Windows-${{ github.run_number }}
          path: |
            artifacts/*.msi
            artifacts/*.zip
          if-no-files-found: error
          retention-days: 14