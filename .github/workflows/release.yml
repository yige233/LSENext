name: Manual Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and publish (for example, v0.2.6)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Test
        run: cargo test --workspace

      - name: Restore WiX tools
        run: dotnet tool restore

      - name: Package x64 release
        shell: pwsh
        run: ./scripts/package.ps1 -Architecture x64 -Configuration release -ReleaseTag "${{ inputs.release_tag }}"

      - name: Package ARM64 release
        shell: pwsh
        run: ./scripts/package.ps1 -Architecture arm64 -Configuration release -ReleaseTag "${{ inputs.release_tag }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: LSENext ${{ inputs.release_tag }}
          prerelease: ${{ contains(inputs.release_tag, '-') }}
          generate_release_notes: true
          files: |
            artifacts/*.msi
            artifacts/*.zip